---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-executables-have-shebangs
      - id: check-symlinks
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args:
          - --fix=lf
        description: Forces to replace line ending by the UNIX 'lf' character.
      - id: trailing-whitespace
  - repo: https://github.com/JohnnyMorganz/StyLua
    rev: v2.5.2
    hooks:
      - id: stylua-system
  - repo: local
    hooks:
      - id: check-startup
        name: Neovim startup
        description: Loads this configuration in a throwaway Neovim and fails on any error.
        entry: scripts/check-startup.sh
        language: script
        files: (\.lua|\.scm|\.sh|^ftdetect/.*\.vim|^spell/.*\.txt|^lazy-lock(\.stable)?\.json)$
        pass_filenames: false
      - id: unit-tests
        name: Unit tests
        description: Runs the plenary-busted specs under tests/spec.
        entry: scripts/test.sh
        language: script
        files: (\.lua|\.scm|\.sh|^ftdetect/.*\.vim|^spell/.*\.txt|^lazy-lock(\.stable)?\.json)$
        pass_filenames: false
      - id: validate-tools
        name: Tool names
        description: Checks every tool named in config.languages against conform, nvim-lint, lspconfig and Mason.
        entry: nvim --clean --headless -l scripts/validate-tools.lua
        language: system
        files: \.lua$
        pass_filenames: false
      - id: keymaps-doc
        name: Keymap reference
        description: Regenerates doc/dyneo-keymaps.txt, so the help lists the mappings the configuration actually sets.
        entry: scripts/keymaps-doc.sh
        language: script
        files: (\.lua|^scripts/keymaps-doc\.sh)$
        pass_filenames: false
      - id: dyshellint
        name: Shell lint
        description: Runs dyshellint (ShellCheck, shfmt and its own rules) on the shell scripts.
        entry: dyshellint
        language: system
        files: \.sh$
      - id: bench
        name: Startup benchmark
        description: Times the startup of this configuration and rewrites the Benchmark section of README.md when a median moved by more than 20%.
        entry: nvim --clean --headless -l scripts/bench.lua
        language: system
        files: (\.lua|^lazy-lock\.json)$
        pass_filenames: false
